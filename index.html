<html lang="fr">

<title>Café RH – La carte</title>
<meta name="description" content="La carte du Café RH, présentée comme un livre : petit-déjeuner, tap\'s, plats, pasta, snack, boissons chaudes et glacées, smoothies et sweets.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root {
  --bg: #faf6ea;
  --ink: #332508;
  --muted: #8a7550;
  --panel: rgba(255,255,255,.90);
  --paper: #fffdf7;
  --line: rgba(180,138,42,.32);
  --price: #a5750f;
  --chip: #f3e7c8;
  --chip-ink: #6b4e14;
  --chip-on: #caa028;
  --chip-on-ink: #ffffff;
  --pattern: rgba(180,138,42,.16);
  --focus: #a5750f;
  --saffron: #d4a017;
  --indigo: #3a2a10;
  --gutter: rgba(60,42,10,.16);
  --font-sans: "Poppins", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-serif: "Lora", Georgia, "Times New Roman", serif;
  box-sizing: border-box;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #140d05; --ink: #f7eedb; --muted: #cbb98c;
    --panel: rgba(46,34,16,.90); --paper: #241a0c;
    --line: rgba(228,183,90,.28); --price: #f0c15c; --chip: rgba(255,255,255,.08); --chip-ink: #f0e4c4;
    --chip-on: #d4a017; --chip-on-ink: #2a1d08; --pattern: rgba(228,183,90,.20); --focus: #f0c15c;
    --gutter: rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"] {
  --bg: #140d05; --ink: #f7eedb; --muted: #cbb98c;
  --panel: rgba(46,34,16,.90); --paper: #241a0c;
  --line: rgba(228,183,90,.28); --price: #f0c15c; --chip: rgba(255,255,255,.08); --chip-ink: #f0e4c4;
  --chip-on: #d4a017; --chip-on-ink: #2a1d08; --pattern: rgba(228,183,90,.20); --focus: #f0c15c;
  --gutter: rgba(0,0,0,.55);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; overscroll-behavior: none; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-sans); font-size: 16px; line-height: 1.5;
  -webkit-text-size-adjust: 100%; overflow: hidden;
}
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 6px; }
button { font: inherit; }

/* ---------- desk backdrop (zellige) ---------- */
.fx { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.fx-desk { position: fixed; inset: 0; z-index: 0; }
.fx-glow {
  position: fixed; inset: -10%; z-index: 0; pointer-events: none; overflow: hidden;
}
.orb {
  position: absolute; width: 60vmax; height: 60vmax; border-radius: 50%;
  background: radial-gradient(circle at 50% 50%, var(--o-c1) 0%, var(--o-c2) 40%, transparent 72%);
  opacity: .55; filter: blur(6px); animation: orbit var(--o-d) ease-in-out infinite;
}
.orb.o1 { --o-c1: rgba(212,160,23,.35); --o-c2: rgba(212,160,23,0); top: -22vmax; left: -18vmax; --o-d: 22s; }
.orb.o2 { --o-c1: rgba(255,236,196,.30); --o-c2: rgba(255,236,196,0); bottom: -26vmax; right: -20vmax; --o-d: 27s; animation-delay: -6s; }
.orb.o3 { --o-c1: rgba(180,138,42,.22); --o-c2: rgba(180,138,42,0); top: 32%; left: 40%; --o-d: 33s; animation-delay: -14s; }
@keyframes orbit {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33% { transform: translate(6vmax, 8vmax) scale(1.08); }
  66% { transform: translate(-7vmax, 5vmax) scale(.95); }
}
:root[data-theme="dark"] .orb { opacity: .8; mix-blend-mode: screen; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .orb { opacity: .8; mix-blend-mode: screen; } }

.fx-particles { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.spark {
  position: absolute; bottom: -6vh; left: var(--x); width: var(--s); height: var(--s); border-radius: 50%;
  background: var(--c); filter: blur(var(--b)); opacity: 0;
  animation: floatup var(--d) linear infinite; animation-delay: var(--delay);
}
@keyframes floatup {
  0% { transform: translate(0, 0); opacity: 0; }
  10% { opacity: var(--op); }
  50% { transform: translate(var(--sway), -54vh); }
  90% { opacity: var(--op); }
  100% { transform: translate(calc(var(--sway) * -0.2), -112vh); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) { .orb, .spark { animation: none; opacity: .25; } }
.pat { position: absolute; left: -270px; top: -270px; width: calc(100% + 270px); height: calc(100% + 270px); animation: drift 48s linear infinite; color: var(--pattern); }
@keyframes drift { to { transform: translate(270px, 270px); } }

/* ---------- stage & book ---------- */
.stage-wrap {
  position: fixed; inset: 0; z-index: 1; display: flex; align-items: center; justify-content: center;
  padding: max(14px, env(safe-area-inset-top, 0px)) 12px max(14px, env(safe-area-inset-bottom, 0px));
}
.stage {
  position: relative; width: 100%; height: 100%; max-width: 460px; height: min(880px, 100%);
  border-radius: 22px; overflow: hidden;
  box-shadow: 0 30px 70px rgba(20,14,4,.32), 0 8px 20px rgba(20,14,4,.20), 0 0 0 1px rgba(255,255,255,.35) inset;
  padding-top: 0; padding-bottom: 0;
}
:root[data-theme="dark"] .stage { box-shadow: 0 30px 70px rgba(0,0,0,.55), 0 8px 20px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.08) inset; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .stage { box-shadow: 0 30px 70px rgba(0,0,0,.55), 0 8px 20px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.08) inset; } }
@media (min-width: 760px) {
  .stage-wrap { padding: 4vh 20px; }
  .stage {
    box-shadow: 0 46px 90px rgba(20,14,4,.38), 0 14px 30px rgba(20,14,4,.22);
  }
}
.book { position: absolute; inset: 0; perspective: 2400px; }
.pages { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; }
.page {
  position: absolute; inset: 0; background: var(--paper); color: var(--ink);
  transform-origin: left center; backface-visibility: hidden;
  transition: transform .8s cubic-bezier(.45,.05,.15,1);
  display: flex; flex-direction: column;
}
.page.flipped { transform: rotateY(-179.9deg); }
.page::before {
  content: ""; position: absolute; inset: 0 auto 0 0; width: 44px;
  background: linear-gradient(to right, var(--gutter), transparent); pointer-events: none; z-index: 2;
}
.spine {
  position: absolute; left: 0; top: 0; bottom: 0; width: 22px; z-index: 90; pointer-events: none;
  background: linear-gradient(to right, rgba(0,0,0,.30), transparent);
}

.page.cat .page-top, .page.cat .page-body { position: relative; z-index: 1; }
:root[data-theme="dark"] .page.cat::after { opacity: .12; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .page.cat::after { opacity: .12; } }

/* ---------- page chrome (running head/folio) ---------- */
.page-top {
  flex: none; display: flex; align-items: center; justify-content: space-between;
  padding: calc(env(safe-area-inset-top, 0px) + 16px) 22px 2px;
}
@media (min-width: 760px) { .page-top { padding-top: 16px; } }
.page-top .brand { font: 700 .74rem var(--font-sans); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.page-top .folio { font: 600 .78rem var(--font-sans); color: var(--muted); font-variant-numeric: tabular-nums; }
.page-body { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 22px calc(env(safe-area-inset-bottom, 0px) + 74px); }

/* ---------- category page content ---------- */
.head { display: flex; align-items: center; gap: 16px; margin: 10px 0 6px; }
.badge { flex: none; width: 78px; height: 78px; }
.badge svg { width: 100%; height: 100%; display: block; }
.badge-photo { border-radius: 50%; overflow: hidden; border: 2.5px solid var(--saffron); box-shadow: 0 4px 14px rgba(120,90,10,.22); }
.badge-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.head h2 { margin: 0; font-size: clamp(1.3rem, 5.6vw, 1.6rem); line-height: 1.15; font-weight: 700; }
.head h2::after { content: ""; display: block; width: 38px; height: 3px; margin-top: 8px; background: var(--saffron); border-radius: 2px; }
.head p { margin: 7px 0 0; font: italic 400 .92rem/1.35 var(--font-serif); color: var(--muted); }
.items { list-style: none; margin: 10px 0 0; padding: 0; }
.item { padding: 11px 0 10px; border-bottom: 1px dashed var(--line); }
.item:last-child { border-bottom: 0; }
.row { display: flex; align-items: baseline; gap: 10px; }
.name { font-weight: 500; font-size: .98rem; }
.dots { flex: 1; min-width: 14px; border-bottom: 2px dotted var(--line); transform: translateY(-4px); }
.price { font-weight: 700; font-size: .98rem; color: var(--price); white-space: nowrap; }
.desc { margin: 3px 0 0; font: italic 400 .87rem/1.4 var(--font-serif); color: var(--muted); }

.subhead { padding: 18px 0 4px; border-bottom: 2px solid var(--saffron); }
.subhead:first-child { padding-top: 6px; }
.subhead h3 { margin: 0; font-size: .82rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--price); }
.subhead p { margin: 2px 0 0; font: italic 400 .85rem/1.35 var(--font-serif); color: var(--muted); }
.subhead + .item { padding-top: 9px; }

/* ---------- cover & closing pages ---------- */
/* ---- logo 3D ---- */
.arch{width:min(50vw,190px);height:auto;aspect-ratio:638/979;position:relative;perspective:900px;overflow:visible}
.closing .arch{width:min(34vw,130px)}
.lg-stack{position:absolute;inset:0;transform-style:preserve-3d;animation:lgsway 7s ease-in-out 2.4s infinite;transform:rotateX(calc(var(--ty,0)*1deg)) rotateY(calc(var(--tx,0)*1deg))}
.lg-l{position:absolute;inset:0;width:100%;height:100%;overflow:visible;fill:var(--c);transform:translateZ(calc(var(--i)*-2.6px));opacity:0;animation:lgl .01s linear forwards,lgext 1.2s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(1.9s + var(--i)*.03s)}
.lg-l.f{opacity:1;animation:none}
.lg-l .st{fill:none;stroke:var(--saffron);stroke-width:5;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:lgdraw 1.7s cubic-bezier(.5,0,.2,1) forwards;animation-delay:calc(var(--k)*.045s)}
.lg-l .fl{opacity:0;animation:lgfill .7s ease 1.5s forwards;fill:var(--saffron)}
@keyframes lgdraw{to{stroke-dashoffset:0}}
@keyframes lgfill{to{opacity:1}}
@keyframes lgl{to{opacity:1}}
@keyframes lgext{from{transform:translateZ(0)}}
@keyframes lgsway{0%,100%{transform:rotateX(10deg) rotateY(-26deg)}50%{transform:rotateX(-4deg) rotateY(26deg)}}
.lg-stack.drag{animation:none}
@media (prefers-reduced-motion:reduce){.lg-stack{animation:none}.lg-l .st{animation:none;stroke-dashoffset:0}.lg-l .fl{animation:none;opacity:1}}

.page.cover .page-body, .page.closing .page-body {
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  padding: 0 26px; cursor: pointer;
}
.cover h1 { margin: 18px 0 0; font-size: clamp(2.3rem, 11vw, 3.2rem); font-weight: 700; letter-spacing: -.01em; }
.cover .tag { margin: 6px 0 0; font: italic 400 1.15rem/1.3 var(--font-serif); color: var(--price); }
.hint { margin-top: 30px; display: inline-flex; align-items: center; gap: 8px; padding: 11px 22px; border-radius: 999px; background: var(--saffron); color: #fff; font-weight: 600; font-size: .92rem; animation: pulse 2.2s ease-in-out infinite; }
.hint svg { width: 16px; height: 16px; }
@keyframes pulse { 0%,100% { transform: translateX(0); } 50% { transform: translateX(5px); } }
.closing h2 { margin: 6px 0 0; font-size: clamp(1.8rem, 8vw, 2.4rem); font-weight: 700; }
.closing p.thanks { margin: 8px 0 0; font: italic 400 1.05rem var(--font-serif); color: var(--muted); }
.closing p.small { margin: 2px 0 0; font-size: .82rem; color: var(--muted); }
.again { margin-top: 26px; padding: 11px 22px; border-radius: 999px; background: transparent; border: 1.5px solid var(--saffron); color: var(--price); font-weight: 600; font-size: .9rem; cursor: pointer; }

/* ---------- edge tap zones ---------- */
.edge { position: absolute; top: 0; bottom: 0; width: 16%; z-index: 40; background: transparent; border: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
.edge.left { left: 0; cursor: w-resize; }
.edge.right { right: 0; cursor: e-resize; }

/* ---------- floating controls ---------- */
.top-controls { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 10px); right: 10px; z-index: 210; display: flex; gap: 8px; }
.btn-round {
  width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel);
  color: var(--ink); display: grid; place-items: center; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); cursor: pointer;
}
.btn-round svg { width: 18px; height: 18px; }
.btn-round[disabled] { opacity: .32; pointer-events: none; }
.btn-round .sun { display: none; }
:root[data-theme="dark"] .btn-round .sun { display: block; }
:root[data-theme="dark"] .btn-round .moon { display: none; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .btn-round .sun { display: block; }
  :root:not([data-theme="light"]) .btn-round .moon { display: none; }
}

.bottom-controls {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 200; display: flex; align-items: center; justify-content: center; gap: 14px;
  padding: 10px 16px calc(env(safe-area-inset-bottom, 0px) + 12px);
}
.folio-pill {
  padding: 8px 16px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line);
  font-size: .8rem; color: var(--muted); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); min-width: 88px; text-align: center;
}

/* ---------- overlays (TOC / search) ---------- */
.overlay {
  position: absolute; inset: 0; z-index: 300; background: var(--paper);
  display: flex; flex-direction: column; transform: translateY(100%); transition: transform .35s ease;
}
.overlay.open { transform: translateY(0); }
.overlay-head {
  flex: none; display: flex; align-items: center; justify-content: space-between;
  padding: calc(env(safe-area-inset-top, 0px) + 16px) 18px 12px; border-bottom: 1px solid var(--line);
}
.overlay-head h3 { margin: 0; font-size: 1.05rem; }
.toc-list, .search-list { flex: 1; overflow-y: auto; padding: 8px 12px calc(env(safe-area-inset-bottom, 0px) + 16px); -webkit-overflow-scrolling: touch; }
.toc-item {
  display: flex; align-items: center; gap: 14px; width: 100%; padding: 10px; margin: 2px 0;
  border: 0; background: transparent; text-align: left; border-radius: 14px; color: var(--ink); cursor: pointer;
}
.toc-item:hover, .toc-item:active { background: var(--chip); }
.toc-item .ic { width: 42px; height: 42px; flex: none; border-radius: 50%; overflow: hidden; }
.toc-item .ic svg, .toc-item .ic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.toc-item .tx b { display: block; font-size: .96rem; font-weight: 600; }
.toc-item .tx span { display: block; font-size: .78rem; color: var(--muted); }
.search-box { flex: none; position: relative; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.search-box input {
  width: 100%; font: 400 .96rem var(--font-sans); color: var(--ink); background: var(--chip);
  border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 12px 40px;
}
.search-box svg { position: absolute; left: 30px; top: 50%; width: 18px; height: 18px; transform: translateY(-50%); color: var(--muted); }
.sgroup { margin: 14px 4px 4px; }
.sgroup h4 { margin: 0 0 4px; font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.sresult { display: flex; align-items: baseline; gap: 8px; padding: 9px 4px; border-bottom: 1px dashed var(--line); background: transparent; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; color: var(--ink); cursor: pointer; }
.sresult .name { flex: none; font-weight: 500; font-size: .93rem; }
.sresult .dots { flex: 1; border-bottom: 2px dotted var(--line); transform: translateY(-4px); }
.sresult .price { font-weight: 700; color: var(--price); font-size: .93rem; }
.sempty { text-align: center; padding: 40px 16px; color: var(--muted); }

@media (prefers-reduced-motion: reduce) {
  .pat { animation: none; }
  .page { transition: none; }
  .hint { animation: none; }
}

/* ================= ANIMATIONS (added) ================= */
@media (prefers-reduced-motion: no-preference) {
@keyframes riseIn { from { opacity: 0; transform: translateY(18px); filter: blur(6px); } }
@keyframes itemIn { from { opacity: 0; transform: translateY(16px) scale(.98); } }
@keyframes stageIn { from { opacity: 0; transform: translateY(28px) scale(.96); } }
@keyframes badgePop { from { opacity: 0; transform: scale(.4) rotate(-25deg); } }
@keyframes growX { from { transform: scaleX(0); } }
@keyframes dotsIn { from { clip-path: inset(-6px 100% -6px 0); } to { clip-path: inset(-6px 0 -6px 0); } }
@keyframes priceIn { from { opacity: 0; transform: scale(.6); } 60% { transform: scale(1.14); } }
@keyframes kenburns { from { transform: scale(1.3); } to { transform: scale(1); } }
@keyframes flipShade { 0%, 100% { box-shadow: 0 0 0 rgba(0,0,0,0); } 35% { box-shadow: 14px 0 46px rgba(0,0,0,.38); } }
@keyframes shimmer { 0%, 55% { transform: translateX(-130%); } 100% { transform: translateX(130%); } }
@keyframes nudge { 50% { transform: translateX(3px); } }
@keyframes bump { 40% { transform: scale(1.14); } }

/* stage entrance */
.stage { animation: stageIn .9s cubic-bezier(.2,.8,.2,1) backwards; }

/* cover */
.page.cover.is-active h1 { animation: riseIn .9s cubic-bezier(.2,.8,.2,1) 1.1s backwards; }
.page.cover.is-active .tag { animation: riseIn .8s cubic-bezier(.2,.8,.2,1) 1.4s backwards; }
.page.cover.is-active .hint { position: relative; overflow: hidden; animation: riseIn .7s cubic-bezier(.2,.8,.2,1) 1.8s backwards, pulse 2.2s ease-in-out 2.6s infinite; }
.page.cover.is-active .hint::after { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.5) 50%, transparent 70%); transform: translateX(-130%); animation: shimmer 3.4s ease-in-out 3s infinite; }

/* category pages: hidden until they become the current page */
.page.cat:not(.flipped):not(.is-active) :is(.badge, .head h2, .head p, .item, .subhead) { opacity: 0; }
.page.cat.is-active .badge { animation: badgePop .8s cubic-bezier(.34,1.56,.64,1) .3s backwards; }
.page.cat.is-active .badge-photo img { animation: kenburns 9s ease-out both; }
.page.cat.is-active .head h2 { animation: riseIn .6s cubic-bezier(.2,.8,.2,1) .4s backwards; }
.page.cat.is-active .head h2::after { transform-origin: left; animation: growX .6s ease .8s backwards; }
.page.cat.is-active .head p { animation: riseIn .6s cubic-bezier(.2,.8,.2,1) .5s backwards; }
.page.cat.is-active :is(.item, .subhead) { animation: itemIn .55s cubic-bezier(.2,.8,.2,1) calc(.4s + var(--n, 0) * 55ms) backwards; }
.page.cat.is-active .item .dots { animation: dotsIn .7s ease calc(.5s + var(--n, 0) * 55ms) backwards; }
.page.cat.is-active .item .price { transform-origin: right center; animation: priceIn .6s cubic-bezier(.34,1.56,.64,1) calc(.55s + var(--n, 0) * 55ms) backwards; }

/* touch / hover feedback */
.item { transition: background .25s ease, padding-left .25s ease; }
.item .price { transition: transform .25s cubic-bezier(.34,1.56,.64,1); transform-origin: right center; }
.item:active { background: linear-gradient(90deg, var(--chip), transparent); }
@media (hover: hover) {
  .item:hover { padding-left: 6px; background: linear-gradient(90deg, var(--chip), transparent); }
  .item:hover .price { transform: scale(1.1); }
}
.btn-round { transition: transform .2s cubic-bezier(.34,1.56,.64,1), background .2s ease, opacity .2s ease; }
.btn-round:active { transform: scale(.86); }
@media (hover: hover) { .btn-round:hover { transform: translateY(-2px); } }
.again { transition: background .25s ease, color .25s ease, transform .2s ease; }
.again:hover { background: var(--saffron); color: #fff; }
.again:active { transform: scale(.94); }
.nudge svg { animation: nudge 1.4s ease-in-out infinite; }
.folio-pill.bump { animation: bump .4s ease; }

/* page flip shadow */
.page.flipping { animation: flipShade .85s ease-in-out; }

/* closing page */
.page.closing:not(.flipped):not(.is-active) .page-body > :not(.arch) { opacity: 0; }
.page.closing.is-active h2 { animation: riseIn .7s cubic-bezier(.2,.8,.2,1) .9s backwards; }
.page.closing.is-active .thanks { animation: riseIn .7s cubic-bezier(.2,.8,.2,1) 1.1s backwards; }
.page.closing.is-active .small { animation: riseIn .7s cubic-bezier(.2,.8,.2,1) 1.25s backwards; }
.page.closing.is-active .again { animation: riseIn .7s cubic-bezier(.2,.8,.2,1) 1.45s backwards; }

/* overlays */
.overlay.open .toc-item { animation: itemIn .45s cubic-bezier(.2,.8,.2,1) calc(.15s + var(--n, 0) * 40ms) backwards; }
.overlay.open .sempty { animation: riseIn .4s ease backwards; }
}

/* ---------- build pages ---------- */
var pagesEl = document.getElementById("pages");
var pages = [];
var total = MENU.length + 2; /* cover + categories + closing */

function addPage(el, cls) {
  el.className = "page" + (cls ? " " + cls : "");
  el.style.zIndex = total - pages.length;
  pagesEl.appendChild(el);
  pages.push(el);
}

/* cover */
(function () {
  var el = document.createElement("div");
  el.innerHTML = '<div class="page-body">' + archSVG() +
    '<h1>Café RH</h1><p class="tag">La carte</p>' +
    '<div class="hint">Touchez pour ouvrir<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></div></div>';
  addPage(el, "cover");
})();

/* category pages */
MENU.forEach(function (c, idx) {
  var el = document.createElement("div");
  var badgeInner = c.photo ? '<img src="' + c.photo + '" alt="' + esc(c.title) + '" loading="lazy">' : ICONS[c.icon];
  var html = '<div class="page-top"><span class="brand">Café RH</span><span class="folio">' + (idx + 1) + ' / ' + MENU.length + '</span></div>' +
    '<div class="page-body"><div class="head"><div class="badge' + (c.photo ? ' badge-photo' : '') + '">' + badgeInner + '</div><div><h2>' + esc(c.title) + '</h2>' +
    (c.sub ? '<p>' + esc(c.sub) + '</p>' : '') + '</div></div><ul class="items">';
  c.items.forEach(function (it) {
    if (it[0].charAt(0) === "#") {
      html += '<li class="subhead"><h3>' + esc(it[0].slice(1)) + '</h3>' + (it[1] ? '<p>' + esc(it[1]) + '</p>' : '') + '</li>';
      return;
    }
    html += '<li class="item"><div class="row"><span class="name">' + esc(it[0]) + '</span><span class="dots"></span><span class="price">' + esc(it[1]) + '</span></div>' +
      (it[2] ? '<p class="desc">' + esc(it[2]) + '</p>' : '') + '</li>';
  });
  el.innerHTML = html + '</ul></div>';
  addPage(el, "cat");
});

/* closing */
(function () {
  var el = document.createElement("div");
  el.innerHTML = '<div class="page-body">' + archSVG() +
    '<h2>Bon appétit</h2><p class="thanks">Merci de votre visite chez Café RH</p>' +
    '<p class="small">Prix en dirhams (DH), toutes taxes comprises</p>' +
    '<button class="again" id="againBtn" type="button">Revenir à la couverture</button></div>';
  addPage(el, "closing");
})();

/* mark cover/closing arches as always-drawn (no scroll-triggered animation needed) */
document.querySelectorAll(".page.cover, .page.closing").forEach(function (p) { p.classList.add("revealed"); });

/* ---------- pagination state ---------- */
var current = 0;
var folioPill = document.getElementById("folioPill");
var prevBtn = document.getElementById("prevBtn"), nextBtn = document.getElementById("nextBtn");

function apply() {
  pages.forEach(function (el, i) { el.classList.toggle("flipped", i < current); });
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === pages.length - 1;
  if (current === 0) folioPill.textContent = "Couverture";
  else if (current === pages.length - 1) folioPill.textContent = "Fin";
  else folioPill.textContent = current + " / " + MENU.length;
}
function next() { if (current < pages.length - 1) { current++; apply(); } }
function prev() { if (current > 0) { current--; apply(); } }
function goTo(i) { current = Math.max(0, Math.min(pages.length - 1, i)); apply(); closeOverlays(); }
apply();

prevBtn.addEventListener("click", prev);
nextBtn.addEventListener("click", next);
document.getElementById("edgeLeft").addEventListener("click", prev);
document.getElementById("edgeRight").addEventListener("click", next);
document.querySelector(".page.cover .page-body").addEventListener("click", next);
document.getElementById("againBtn").addEventListener("click", function () { goTo(0); });
document.addEventListener("keydown", function (e) {
  if (e.key === "ArrowRight") next();
  else if (e.key === "ArrowLeft") prev();
  else if (e.key === "Escape") closeOverlays();
});

/* swipe */
(function () {
  var sx = 0, sy = 0, tracking = false;
  var stage = document.getElementById("stage");
  stage.addEventListener("pointerdown", function (e) { sx = e.clientX; sy = e.clientY; tracking = true; });
  stage.addEventListener("pointerup", function (e) {
    if (!tracking) return; tracking = false;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.3) { if (dx > 0) prev(); else next(); }
  });
})();

/* ---------- TOC overlay ---------- */
var tocOverlay = document.getElementById("tocOverlay"), tocList = document.getElementById("tocList");
var searchOverlay = document.getElementById("searchOverlay");
function closeOverlays() { tocOverlay.classList.remove("open"); searchOverlay.classList.remove("open"); }
document.getElementById("tocBtn").addEventListener("click", function () { tocList.innerHTML = buildTOC(); tocOverlay.classList.add("open"); });
document.getElementById("tocClose").addEventListener("click", closeOverlays);
document.getElementById("searchClose").addEventListener("click", closeOverlays);

function buildTOC() {
  var rows = "";
  rows += '<button class="toc-item" data-i="0"><span class="ic">' + archMini() + '</span><span class="tx"><b>Couverture</b><span>Café RH</span></span></button>';
  MENU.forEach(function (c, i) {
    var inner = c.photo ? '<img src="' + c.photo + '" alt="">' : ICONS[c.icon];
    rows += '<button class="toc-item" data-i="' + (i + 1) + '"><span class="ic">' + inner + '</span><span class="tx"><b>' + esc(c.title) + '</b><span>' + (c.sub ? esc(c.sub) : c.items.filter(function (x) { return x[0].charAt(0) !== "#"; }).length + " articles") + '</span></span></button>';
  });
  rows += '<button class="toc-item" data-i="' + (pages.length - 1) + '"><span class="ic">' + archMini() + '</span><span class="tx"><b>Dernière page</b><span>Merci</span></span></button>';
  return rows;
}
function archMini() { return '<svg viewBox="-100 -100 200 200"><circle r="98" fill="#fbf3df"/><text x="0" y="14" text-anchor="middle" font-size="70" font-weight="700" fill="' + SAF + '" font-family="Poppins, sans-serif">RH</text></svg>'; }
tocList.addEventListener("click", function (e) {
  var b = e.target.closest(".toc-item"); if (!b) return;
  goTo(parseInt(b.dataset.i, 10));
});

/* ---------- search overlay ---------- */
var sq = document.getElementById("sq"), sresults = document.getElementById("sresults");
document.getElementById("searchBtn").addEventListener("click", function () {
  searchOverlay.classList.add("open"); sq.value = ""; renderSearch(""); setTimeout(function () { sq.focus(); }, 260);
});
sq.addEventListener("input", function () { renderSearch(sq.value.trim()); });
function renderSearch(term) {
  var nt = norm(term), html = "", found = 0;
  MENU.forEach(function (c, ci) {
    var rows = "";
    c.items.forEach(function (it) {
      if (it[0].charAt(0) === "#") return;
      var k = norm(it[0] + " " + (it[2] || ""));
      if (!nt || k.indexOf(nt) !== -1) {
        found++;
        rows += '<button class="sresult" data-i="' + (ci + 1) + '"><span class="name">' + esc(it[0]) + '</span><span class="dots"></span><span class="price">' + esc(it[1]) + '</span></button>';
      }
    });
    if (rows) html += '<div class="sgroup"><h4>' + esc(c.title) + '</h4>' + rows + '</div>';
  });
  sresults.innerHTML = found ? html : '<div class="sempty">Aucun résultat</div>';
}
sresults.addEventListener("click", function (e) {
  var b = e.target.closest(".sresult"); if (!b) return;
  goTo(parseInt(b.dataset.i, 10));
});

/* ---------- zellige desk pattern ---------- */
function patternSVG(uid) {
  var c = 135, P = function (R, rot) {
    return [45, 135, 225, 315].map(function (a) {
      var r = (a + rot) * Math.PI / 180;
      return (c + R * Math.cos(r)).toFixed(1) + "," + (c + R * Math.sin(r)).toFixed(1);
    }).join(" ");
  };
  var oct = []; for (var i = 0; i < 8; i++) { var r = (i * 45 + 22.5) * Math.PI / 180; oct.push((c + 62 * Math.cos(r)).toFixed(1) + "," + (c + 62 * Math.sin(r)).toFixed(1)); }
  var corner = function (x, y) {
    return '<polygon points="' + [[x, y - 46], [x + 46, y], [x, y + 46], [x - 46, y]].map(function (p) { return p.join(","); }).join(" ") + '"/>';
  };
  return '<svg class="pat" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="' + uid + '" width="270" height="270" patternUnits="userSpaceOnUse">' +
    '<g fill="none" stroke="currentColor" stroke-width="1.4"><polygon points="' + P(112, 0) + '"/><polygon points="' + P(112, 45) + '"/>' +
    corner(0, 0) + corner(270, 0) + corner(0, 270) + corner(270, 270) + '</g>' +
    '<polygon points="' + oct.join(" ") + '" fill="currentColor" fill-opacity=".22"/>' +
    '<g fill="' + SAF + '" fill-opacity=".55"><circle cx="0" cy="135" r="5"/><circle cx="270" cy="135" r="5"/><circle cx="135" cy="0" r="5"/><circle cx="135" cy="270" r="5"/></g>' +
    '</pattern></defs><rect width="100%" height="100%" fill="url(#' + uid + ')"/></svg>';
}
document.getElementById("fxDesk").innerHTML = patternSVG("zd");

/* ---------- floating particles ---------- */
(function () {
  var host = document.getElementById("fxParticles");
  var cols = ["#d4a017", "#e9c877", "#fff6df"];
  for (var i = 0; i < 26; i++) {
    var el = document.createElement("span"); el.className = "spark";
    var s = 3 + Math.random() * 11;
    el.style.cssText = "--x:" + (Math.random() * 100).toFixed(1) + "%;--s:" + s.toFixed(1) + "px;--b:" + (s > 9 ? 2.4 : 0.5).toFixed(1) + "px;--c:" + cols[i % cols.length] +
      ";--op:" + (0.35 + Math.random() * 0.4).toFixed(2) + ";--d:" + (10 + Math.random() * 12).toFixed(1) + "s;--delay:-" + (Math.random() * 20).toFixed(1) + "s;--sway:" + ((Math.random() - .5) * 80).toFixed(0) + "px";
    host.appendChild(el);
  }
})();

/* ---------- theme ---------- */
var root = document.documentElement;
try { var saved = localStorage.getItem("cafe-rh-theme"); if (saved) root.setAttribute("data-theme", saved); } catch (e) {}
document.getElementById("themeBtn").addEventListener("click", function () {
  var cur = root.getAttribute("data-theme");
  if (!cur) cur = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  var nextT = cur === "dark" ? "light" : "dark";
  root.setAttribute("data-theme", nextT);
  try { localStorage.setItem("cafe-rh-theme", nextT); } catch (e) {}
});

(function(){var p=document.querySelector(".page.cover .page-body");if(!p)return;var s=p.querySelector(".lg-stack");
p.addEventListener("pointermove",function(e){var r=p.getBoundingClientRect();s.classList.add("drag");s.style.setProperty("--tx",((e.clientX-r.left)/r.width-.5)*50);s.style.setProperty("--ty",-((e.clientY-r.top)/r.height-.5)*30);});
p.addEventListener("pointerleave",function(){s.classList.remove("drag");});})();

/* ================= ANIMATIONS (added) ================= */
(function () {
  /* stagger index for list rows */
  pages.forEach(function (p) {
    p.querySelectorAll(".item, .subhead").forEach(function (li, i) { li.style.setProperty("--n", Math.min(i, 14)); });
  });

  /* redraw the logo when its page comes back into view */
  function restartLogo(root) {
    var nodes = root.querySelectorAll(".lg-l, .lg-l .st, .lg-l .fl");
    nodes.forEach(function (n) { n.style.animation = "none"; });
    void root.offsetWidth;
    nodes.forEach(function (n) { n.style.animation = ""; });
  }

  var _apply = apply, _build = buildTOC, first = true, lastText = folioPill.textContent;

  apply = function () {
    var before = pages.map(function (p) { return p.classList.contains("flipped"); });
    _apply();
    pages.forEach(function (p, i) {
      var on = i === current, was = p.classList.contains("is-active");
      p.classList.toggle("is-active", on);
      if (before[i] !== p.classList.contains("flipped")) {
        p.classList.remove("flipping"); void p.offsetWidth; p.classList.add("flipping");
        setTimeout(function () { p.classList.remove("flipping"); }, 900);
      }
      if (on && !was && !first && (p.classList.contains("closing") || p.classList.contains("cover"))) restartLogo(p);
    });
    nextBtn.classList.toggle("nudge", current === 0);
    if (folioPill.textContent !== lastText) {
      lastText = folioPill.textContent;
      folioPill.classList.remove("bump"); void folioPill.offsetWidth; folioPill.classList.add("bump");
    }
    first = false;
  };

  /* stagger the table-of-contents rows */
  buildTOC = function () {
    var n = 0;
    return _build().replace(/<button class="toc-item"/g, function () { return '<button style="--n:' + (n++) + '" class="toc-item"'; });
  };

  apply();
})();
</script>
</body>
